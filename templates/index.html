<title>AI Scam Awareness Tool</title>
<style nonce="{{ nonce }}">
  @font-face { font-family:"Source Sans 3"; font-style:normal; font-weight:200 900; font-display:swap;

  @font-face { font-family:"Source Serif 4"; font-style:normal; font-weight:200 900; font-display:swap;
    src:url(/static/fonts/source-serif-4-latin-ext-wght-normal.woff2) format("woff2");

  :root {
    --bg:#ffffff; --surface:#ffffff; --subtle:#f5f6f8; --line:#d8dce3; --line-strong:#aab1bd;
    --text:#16191f; --muted:#555d6b; --accent:#17375e; --accent-hover:#0f2744; --accent-text:#ffffff; --link:#17375e;
    --ok:#1b6b3a; --warn:#8a5a00; --bad:#b3261e; --ok-bg:#eaf5ee; --warn-bg:#fff6e0; --bad-bg:#fdecea; --info-bg:#eef3fa;
    --focus:#1a5fd1;
    --serif:"Source Serif 4",Georgia,"Times New Roman","Noto Sans Telugu",serif;
    --sans:"Source Sans 3","Noto Sans Telugu","Nirmala UI","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#101317; --surface:#171b21; --subtle:#1d222a; --line:#2c333d; --line-strong:#47505e;
    --text:#eceff4; --muted:#a3acba; --accent:#7fb0f0; --accent-hover:#a3c6f5; --accent-text:#0b1220; --link:#9bc2f6;
    --ok:#5fd18a; --warn:#f0b64a; --bad:#ff8a80; --ok-bg:#12261a; --warn-bg:#2a2210; --bad-bg:#2e1715; --info-bg:#16202e;
    --focus:#8fbdff;
  }
  html[data-theme="contrast"] {
    --bg:#000; --surface:#000; --subtle:#000; --line:#ffff00; --line-strong:#ffff00;
    --text:#fff; --muted:#ffff99; --accent:#ffff00; --accent-hover:#fff; --accent-text:#000; --link:#00ffff;
    --ok:#00ff66; --warn:#ffcc00; --bad:#ff7777; --ok-bg:#000; --warn-bg:#000; --bad-bg:#000; --info-bg:#000; --focus:#00ffff;
  }
  html { font-size:17px; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html[data-size="s"] { font-size:15.5px; }
  html[data-size="l"] { font-size:19.5px; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; background:var(--bg); color:var(--text); font-family:var(--sans); line-height:1.6;
    overflow-x:hidden; -webkit-font-smoothing:antialiased; padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
  .hidden { display:none !important; }
  a { color:var(--link); }
  .sprite { position:absolute; width:0; height:0; overflow:hidden; }
  h1, h2, h3 { font-family:var(--serif); }

  /* ===== emergency strip + header ===== */
  .alert-bar { display:block; text-align:center; padding:9px 14px; padding-top:calc(9px + env(safe-area-inset-top,0px)); font-weight:600; font-size:.92rem; text-decoration:none;
    color:#fff; background:var(--bad); }
  html[data-theme="dark"] .alert-bar { background:#8c1d18; }
  html[data-theme="contrast"] .alert-bar { color:#000; background:#ffff00; }
  .site-head { background:var(--surface); border-bottom:1px solid var(--line); }
  .site-head .in { max-width:860px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand { display:flex; align-items:center; gap:10px; font-family:var(--serif); font-weight:650; font-size:1.12rem; line-height:1.2; min-width:0; }
  .brand svg { flex:none; width:28px; height:28px; color:var(--accent); }
  .brand span { overflow:hidden; text-overflow:ellipsis; }

  /* ===== buttons ===== */
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:10px 22px; border:1px solid var(--accent); border-radius:6px; cursor:pointer;
    font:inherit; font-weight:600; color:var(--accent-text); background:var(--accent); text-decoration:none; text-align:center; touch-action:manipulation; }
  .btn:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  .btn:disabled { opacity:.65; cursor:progress; }
  .btn.ghost { background:transparent; color:var(--text); border-color:var(--line-strong); }
  .btn.ghost:hover { background:var(--subtle); }
  .btn.small { min-height:40px; padding:8px 14px; font-size:.92rem; }
  .btn.call { background:var(--bad); border-color:var(--bad); color:#fff; display:flex; margin-top:10px; }
  .btn.call:hover { filter:brightness(.92); }
  html[data-theme="dark"] .btn.call { background:#c2362d; border-color:#c2362d; }
  html[data-theme="contrast"] .btn.call { background:#ffff00; border-color:#ffff00; color:#000; }
  .btn.block { display:flex; width:100%; margin-top:8px; }
  .icon-btn { width:44px; height:44px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface); color:var(--text); cursor:pointer; font-size:1.1rem; touch-action:manipulation; }
  textarea:focus-visible, input:focus-visible, button:focus-visible, select:focus-visible, a:focus-visible, .drop:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }

  /* ===== layout ===== */
  .wrap { width:100%; max-width:860px; margin:0 auto; padding:34px 18px 48px; }
  .hero { margin-bottom:28px; }
  .eyebrow { font-size:.82rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:0 0 10px; }
  h1 { margin:0 0 12px; font-size:2.5rem; font-weight:650; letter-spacing:-.01em; line-height:1.15; }
  .tagline { color:var(--muted); margin:0; max-width:640px; font-size:1.12rem; }
  .steps3 { list-style:none; margin:30px 0 0; padding:0; display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  .steps3 li { border-top:2px solid var(--text); padding-top:10px; }
  .steps3 b { display:block; font-family:var(--serif); font-size:1.02rem; margin-bottom:3px; }
  .steps3 span { color:var(--muted); font-size:.93rem; }

  /* ===== cards ===== */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:22px; margin-top:20px; }
  .label { display:block; font-size:.9rem; font-weight:600; margin:12px 0 6px; }
  textarea { width:100%; min-height:170px; padding:12px 14px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface);
    color:var(--text); font:inherit; font-size:1rem; resize:vertical; }
  select { width:100%; min-height:44px; padding:9px 10px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface); color:var(--text); font:inherit; font-size:1rem; }
  select option { color:#16191f; background:#fff; }
  .row-between { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px; }
  .counter { color:var(--muted); font-size:.85rem; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:16px; }
  .chip { min-height:38px; padding:6px 14px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface); color:var(--text); cursor:pointer; font:inherit; font-size:.9rem; touch-action:manipulation; }
  .chip:hover { background:var(--subtle); }
  .drop { margin-top:16px; border:1px dashed var(--line-strong); border-radius:6px; padding:16px; text-align:center; cursor:pointer; background:var(--subtle); }
  .drop:hover, .drop.over { border-color:var(--accent); }
  .drop b { display:block; }
  .thumbs { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .thumb { position:relative; width:112px; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--surface); }
  .thumb img { display:block; width:100%; height:84px; object-fit:cover; }
  .thumb .st { font-size:.72rem; padding:4px 6px; color:var(--muted); min-height:26px; }
  .thumb .pbar { height:4px; background:var(--line); }
  .thumb .pbar > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  .thumb .x { position:absolute; top:2px; right:2px; width:30px; height:30px; border-radius:50%; border:0; cursor:pointer; background:rgba(0,0,0,.7); color:#fff; font-size:.8rem; line-height:1; }
  .ocr-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .ocr-row select { width:auto; min-width:190px; max-width:100%; }
  .privacy-line { color:var(--ok); font-size:.88rem; margin:12px 0 0; }
  .actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }

  /* ===== scanner ===== */
  .scanner { text-align:center; padding:28px 16px; }
  .spinner { width:34px; height:34px; margin:0 auto 12px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ===== results ===== */
  .ind-bar { position:sticky; top:env(safe-area-inset-top,0px); z-index:12; display:flex; align-items:center; gap:12px; margin-top:20px; padding:10px 12px;
    border-radius:8px; background:var(--surface); border:1px solid var(--line); border-left:6px solid var(--muted); }
  .ind-bar[data-level="high"] { border-left-color:var(--bad); }
  .ind-bar[data-level="mid"] { border-left-color:var(--warn); }
  .ind-bar[data-level="safe"] { border-left-color:var(--ok); }
  .verdict-ico { width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:50%; font-weight:800; font-size:1.3rem; font-family:var(--serif);
    border:2px solid var(--muted); color:var(--muted); }
  .ind-bar[data-level="high"] .verdict-ico { border-color:var(--bad); color:var(--bad); background:var(--bad-bg); }
  .ind-bar[data-level="mid"] .verdict-ico { border-color:var(--warn); color:var(--warn); background:var(--warn-bg); }
  .ind-bar[data-level="safe"] .verdict-ico { border-color:var(--ok); color:var(--ok); background:var(--ok-bg); }
  .ind-text { flex:1; min-width:0; }
  .level { font-family:var(--serif); font-size:1.15rem; font-weight:650; line-height:1.3; }
  .ind-score { font-weight:700; font-size:1.1rem; white-space:nowrap; }
  .ind-bar .btn { flex:none; min-height:40px; padding:8px 14px; font-size:.92rem; }
  .why { color:var(--muted); font-size:.9rem; }
  .danger-banner { padding:12px 14px; border-radius:6px; font-weight:600; border:1px solid var(--bad); background:var(--bad-bg); color:var(--text); margin-bottom:12px; }
  .gauge-wrap { max-width:340px; margin:6px auto 0; }
  .gauge-wrap svg { width:100%; height:auto; display:block; overflow:visible; }
  .needle { transform-origin:100px 100px; transform:rotate(-90deg); transition:transform 1s ease-out; }
  html[data-motion="off"] .needle { transition:none; }
  .gauge-num { font-family:var(--serif); font-size:2.3rem; font-weight:700; text-align:center; line-height:1; margin-top:-6px; }
  .gauge-sub { text-align:center; color:var(--muted); font-size:.88rem; font-family:var(--sans); font-weight:400; }
  .signs { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-top:12px; }
  .sign { border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:6px; padding:10px 14px; background:var(--surface); }
  .sign b { display:block; font-weight:650; }
  .steps-list { padding:0 0 0 1.3rem; margin:12px 0 0; }
  .steps-list li { padding:4px 0 4px 4px; margin-bottom:6px; }
  .steps-list li::marker { font-weight:700; color:var(--accent); }
  .emergency { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:14px; padding:12px 14px; border-radius:6px; background:var(--bad-bg); border:1px solid var(--bad); }
  .emergency .btn.call { margin-top:0; }
  .note-card { border-left:4px solid var(--warn); }
  .error-card { border-left:4px solid var(--bad); background:var(--bad-bg); }
  .info-card { border-left:4px solid var(--accent); background:var(--info-bg); }
  .disc { color:var(--muted); font-size:.85rem; margin-top:14px; }
  .footer { border-top:1px solid var(--line); background:var(--subtle); text-align:center; padding:22px 16px calc(26px + env(safe-area-inset-bottom,0px)); color:var(--muted); font-size:.9rem; }
  .footer strong { color:var(--text); }

  /* ===== settings drawer ===== */
  .sidebar { position:fixed; right:0; top:0; bottom:0; width:min(380px,92vw); overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; z-index:40;
    background:var(--bg); border-left:1px solid var(--line-strong); padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));
    transform:translateX(105%); visibility:hidden; transition:transform .22s ease, visibility 0s linear .22s; }
  .sidebar.open { transform:translateX(0); visibility:visible; transition:transform .22s ease; }
  html[data-motion="off"] .sidebar, html[data-motion="off"] .sidebar.open { transition:none; }
  .scrim { position:fixed; inset:0; background:rgba(10,14,20,.5); z-index:30; }
  .side-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .side-head h2 { margin:0; font-size:1.3rem; font-weight:650; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px; }
  .panel h3 { margin:0 0 8px; font-size:1.05rem; font-weight:650; }
  .panel ol, .panel ul { margin:6px 0 0; padding-left:20px; font-size:.93rem; }
  .panel li { margin-bottom:6px; }
  .helpline { border:2px solid var(--bad); }
  html[data-theme="contrast"] .helpline { border-color:#ffff00; }
  .hl-sub { color:var(--muted); font-size:.88rem; margin:0 0 4px; }
  .hl-number { font-family:var(--serif); font-size:3rem; font-weight:700; letter-spacing:3px; line-height:1.1; color:var(--bad); }
  .gap-top { margin-top:16px !important; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; min-height:44px; padding:8px 6px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface); color:var(--text); cursor:pointer; font:inherit; font-size:.9rem; touch-action:manipulation; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  .small-note { color:var(--muted); font-size:.88rem; margin:0; }
  .badge { display:inline-block; margin-top:10px; padding:4px 12px; border-radius:999px; font-size:.82rem; font-weight:600; background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok); }
  .voice-status { margin-top:10px; }

  /* ===== language chooser ===== */
  .overlay { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:60; padding:16px; overflow-y:auto; }
  .modal { max-width:420px; width:100%; text-align:center; }
  .modal .brand { justify-content:center; margin-bottom:20px; }
  .modal h2 { margin:4px 0; font-size:1.5rem; font-weight:650; }
  .modal p { color:var(--muted); margin:12px 0 18px; }
  .modal .btn { display:flex; width:100%; margin-top:12px; font-size:1.15rem; min-height:52px; }

  @media (max-width: 700px) {
    html { font-size:16.5px; }
    .wrap { padding:24px 16px 40px; }
    h1 { font-size:1.9rem; }
    .tagline { font-size:1.03rem; }
    .steps3 { grid-template-columns:1fr; gap:10px; margin-top:20px; }
    .steps3 span { display:none; }
    .steps3 li { padding-top:8px; }
    .card { padding:16px; margin-top:16px; }
    textarea { font-size:16px; }
    select { font-size:16px; }
    .ind-bar { gap:8px; padding:8px 10px; }
    .verdict-ico { width:38px; height:38px; font-size:1.1rem; }
    .level { font-size:1.02rem; }
    .ind-score { font-size:1rem; }
    .ind-bar .btn { padding:8px 10px; font-size:.85rem; }
    .actions .btn { flex:1; }
    .brand { font-size:1rem; }
    .signs { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration:2.5s; } .needle, .sidebar, .sidebar.open { transition:none; } }
</style>

<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false"><defs>
  <symbol id="logo" viewBox="0 0 32 32"><path d="M16 2 4 6.5V15c0 7.6 5 12.9 12 15 7-2.1 12-7.4 12-15V6.5L16 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10.5 16l4 4 7-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<div id="chooser" class="overlay" role="dialog" aria-modal="true" aria-labelledby="chooserTitle">

    <div class="brand"><svg aria-hidden="true"><use href="#logo"/></svg><span>AI Scam Awareness Tool</span></div>

    <h2>మీ భాషను ఎంచుకోండి</h2>
    <p>You can change this anytime in Settings.<br>మీరు దీన్ని సెట్టింగ్‌లలో ఎప్పుడైనా మార్చుకోవచ్చు.</p>

<div id="scrim" class="scrim hidden"></div>

    <h3 data-i18n="hlTitle"></h3>
    <p class="hl-sub" data-i18n="hlSub"></p>

    <a class="btn call" href="tel:1930" data-i18n="callBtn"></a>
    <a class="btn ghost block" href="https://cybercrime.gov.in" target="_blank" rel="noopener noreferrer" data-i18n="portalBtn"></a>
    <h3 class="gap-top" data-i18n="stepsTitle"></h3>
    <ol id="steps"></ol>
  </section>

  <section class="panel">
    <h3 data-i18n="dispTitle"></h3>
    <label class="label" for="langSel" data-i18n="langLabel"></label>
    <select id="langSel"><option value="en">English</option><option value="te">తెలుగు</option></select>
    <span class="label" data-i18n="themeLabel"></span>
    <div class="seg" id="themeSeg">
      <button type="button" data-theme="dark" aria-pressed="false" data-i18n="themeDark"></button>
      <button type="button" data-theme="light" aria-pressed="true" data-i18n="themeLight"></button>
      <button type="button" data-theme="contrast" aria-pressed="false" data-i18n="themeContrast"></button>
    </div>
    <span class="label" data-i18n="sizeLabel"></span>
    <div class="seg" id="sizeSeg">
      <button type="button" data-size="s" aria-pressed="false" data-i18n="sizeS"></button>
      <button type="button" data-size="m" aria-pressed="true" data-i18n="sizeM"></button>
      <button type="button" data-size="l" aria-pressed="false" data-i18n="sizeL"></button>
    </div>

    if (!images.includes(item)) return;
    const u = () => UI[lang];
    try {
      setStatus(item, u().ocrLoading, 2);
      const langs = $("ocrLang").value;
      const w = await getWorker(langs, (m) => {
        if (m.status === "recognizing text") setStatus(item, u().ocrReading, Math.round(10 + m.progress * 90));

      setStatus(item, u().ocrReading, 10);
      const res = await w.recognize(blob);
      const text = (res.data.text || "").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();

/* ===== start: remembered display settings, then always ask for the language ===== */

/* voice controls */
document.querySelectorAll("#vOnSeg button").forEach((b) => b.addEventListener("click", () => { VOICE.on = b.dataset.v === "on"; store("csp_von", b.dataset.v); if (!VOICE.on) stopSpeaking(); voiceMark("vOnSeg", b.dataset.v); }));
document.querySelectorAll("#vGenderSeg button").forEach((b) => b.addEventListener("click", () => { VOICE.gender = b.dataset.v; VOICE.name = ""; store("csp_vgender", VOICE.gender); store("csp_vvoice", ""); voiceRefresh(); }));
document.querySelectorAll("#vSpeedSeg button").forEach((b) => b.addEventListener("click", () => { VOICE.speed = b.dataset.v; store("csp_vspeed", VOICE.speed); voiceMark("vSpeedSeg", VOICE.speed); }));
$("vLang").addEventListener("change", (e) => { VOICE.lang = e.target.value; VOICE.name = ""; store("csp_vlang", VOICE.lang); store("csp_vvoice", ""); voiceRefresh(); });
$("vVoice").addEventListener("change", (e) => { VOICE.name = e.target.value; store("csp_vvoice", VOICE.name); updateVoiceStatus(); });
$("vTest").addEventListener("click", () => { primeVoice(); speakClips(["test"], (l) => SPEECH[l].test); });
$("listenBtn").addEventListener("click", () => { if (speaking) { stopSpeaking(); } else if (lastResult) { speakResult(lastResult); } });

setSetting("theme", load("csp_theme", "light"));
setSetting("size", load("csp_size", "m"));
setSetting("motion", load("csp_motion", "on"));
applyLang();
$("chooser").classList.remove("hidden");
</script>
</body>
</html>
